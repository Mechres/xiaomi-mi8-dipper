# /etc/asound.conf for the Xiaomi Mi 8 (plain ALSA, without PipeWire).
# The speaker path (q6 MultiMedia1 -> QUAT MI2S -> TAS2557) has no hardware
# volume control, so add a software one. "default" plays on the speaker
# through it and records from the bottom microphone (MultiMedia2, see
# tools/audio-defaults.sh). Set the level with: amixer sset Speaker 50%

pcm.speaker {
	type softvol
	slave.pcm "hw:X8,0"
	control {
		name "Speaker Playback Volume"
		card X8
	}
	min_dB -51.0
	max_dB 0.0
	resolution 256
}

pcm.!default {
	type asym
	playback.pcm "plug:speaker"
	capture.pcm "plug:hw:X8,1"
}

ctl.!default {
	type hw
	card X8
}
