# Use case configuration for the Xiaomi Mi 8 (dipper).
# Speaker: TAS2557 on QUAT MI2S (MultiMedia1, hw:0,0)
# Earpiece: WCD9340 EAR over SLIMbus RX0 (MultiMedia2, hw:0,1)
# Microphones: WCD9340 AMIC via ADC3 (bottom) or ADC1 (top) -> DEC0 ->
# SLIMbus TX0 (MultiMedia3, hw:0,2)

SectionVerb {
	EnableSequence [
		cset "name='MultiMedia3 Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='CDC_IF TX0 MUX' DEC0"
		cset "name='ADC MUX0' AMIC"
		cset "name='DEC0 Volume' 84"
	]

	DisableSequence [
		cset "name='MultiMedia3 Mixer SLIMBUS_0_TX' 0"
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='CDC_IF TX0 MUX' ZERO"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
	]

	DisableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia2' 1"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX0 Digital Volume' 84"
	]

	DisableSequence [
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia2' 0"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Mic" {
	Comment "Bottom microphone"

	ConflictingDevice [
		"Mic2"
	]

	EnableSequence [
		cset "name='AMIC MUX0' ADC3"
		cset "name='ADC3 Volume' 12"
	]

	DisableSequence [
		cset "name='AMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}

SectionDevice."Mic2" {
	Comment "Top microphone"

	ConflictingDevice [
		"Mic"
	]

	EnableSequence [
		cset "name='AMIC MUX0' ADC1"
		cset "name='ADC1 Volume' 12"
	]

	DisableSequence [
		cset "name='AMIC MUX0' ZERO"
	]

	Value {
		CapturePriority 50
		CapturePCM "hw:${CardId},2"
	}
}
